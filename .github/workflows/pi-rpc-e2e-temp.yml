name: Pi RPC E2E Temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  pi-rpc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact Pi
        run: npm install -g @earendil-works/pi-coding-agent@0.87.1

      - name: Run deterministic RPC E2E
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pi-e2e"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          export PI_HOME="$ROOT/home"
          mkdir -p "$PI_HOME/.pi/agent"
          export PI_SESSION_DIR="$ROOT/sessions"
          mkdir -p "$PI_SESSION_DIR"

          cat > "$PI_HOME/.pi/agent/models.json" <<'JSON'
          {
            "providers": {
              "mock-openai": {
                "baseUrl": "http://127.0.0.1:18765/v1",
                "api": "openai-completions",
                "apiKey": "test-key",
                "models": [
                  {
                    "id": "mock-model",
                    "name": "Mock Model",
                    "reasoning": false,
                    "input": ["text"],
                    "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                    "contextWindow": 128000,
                    "maxTokens": 4096
                  }
                ]
              }
            }
          }
          JSON

          cat > "$ROOT/mock_server.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_response(404)
                      self.end_headers()
                      return
                  n = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(n).decode()
                  data = json.loads(body)
                  messages = data.get("messages", [])
                  content = messages[-1].get("content", "") if messages else ""
                  prompt = content if isinstance(content, str) else " ".join(x.get("text", "") for x in content if isinstance(x, dict))
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Cache-Control", "no-cache")
                  self.send_header("Connection", "keep-alive")
                  self.end_headers()
                  if "abort" in prompt.lower():
                      import time
                      time.sleep(60)
                      return
                  chunks = ["Hello ", "from ", "Pi."]
                  for text in chunks:
                      event = {
                          "id": "mock-1",
                          "object": "chat.completion.chunk",
                          "created": 0,
                          "model": "mock-model",
                          "choices": [{"index": 0, "delta": {"content": text}, "finish_reason": None}]
                      }
                      self.wfile.write(("data: " + json.dumps(event) + "\n\n").encode())
                      self.wfile.flush()
                  final = {
                      "id": "mock-1",
                      "object": "chat.completion.chunk",
                      "created": 0,
                      "model": "mock-model",
                      "choices": [{"index": 0, "delta": {}, "finish_reason": "stop"}],
                      "usage": {"prompt_tokens": 1, "completion_tokens": 3, "total_tokens": 4}
                  }
                  self.wfile.write(("data: " + json.dumps(final) + "\n\n").encode())
                  self.wfile.write(b"data: [DONE]\n\n")
                  self.wfile.flush()

              def log_message(self, *_):
                  pass

          from socketserver import ThreadingMixIn
          class ThreadingHTTPServer(ThreadingMixIn, HTTPServer):
              daemon_threads = True
          ThreadingHTTPServer(("127.0.0.1", 18765), Handler).serve_forever()
          PY

          python3 "$ROOT/mock_server.py" >"$ROOT/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          export HOME="$PI_HOME"

          cat > "$ROOT/rpc_test.py" <<'PY'
          import json, os, subprocess, sys, time

          session_dir = os.environ["PI_SESSION_DIR"]

          def start(extra):
              return subprocess.Popen(
                  ["pi", "--mode", "rpc", "--session-dir", session_dir, "--provider", "mock-openai", "--model", "mock-model", *extra],
                  stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  text=True, bufsize=1,
              )

          def send(p, obj):
              p.stdin.write(json.dumps(obj) + "\n")
              p.stdin.flush()

          def read_until(p, predicate, timeout=20):
              deadline = time.time() + timeout
              events = []
              while time.time() < deadline:
                  line = p.stdout.readline()
                  if not line:
                      break
                  obj = json.loads(line)
                  events.append(obj)
                  if predicate(obj):
                      return events
              raise AssertionError("Timed out; events=" + repr(events) + "; stderr=" + p.stderr.read())

          # 1) Handshake + model discovery + deterministic streaming.
          p = start([])
          try:
              send(p, {"type": "get_state"})
              state_events = read_until(p, lambda x: x.get("type") == "response" and x.get("command") == "get_state")
              state = next(x["data"] for x in state_events if x.get("type") == "response")
              assert state["sessionId"], state
              session_file = state["sessionFile"]
              send(p, {"type": "get_available_models"})
              models_events = read_until(p, lambda x: x.get("type") == "response" and x.get("command") == "get_available_models")
              models = next(x["data"]["models"] for x in models_events if x.get("type") == "response")
              assert any(m["provider"] == "mock-openai" and m["id"] == "mock-model" for m in models), models

              send(p, {"type": "set_session_name", "name": "RPC E2E"})
              read_until(p, lambda x: x.get("type") == "response" and x.get("command") == "set_session_name")

              send(p, {"type": "prompt", "message": "Say hello"})
              events = read_until(p, lambda x: x.get("type") == "agent_settled", timeout=20)
              deltas = [
                  e["assistantMessageEvent"]["delta"]
                  for e in events
                  if e.get("type") == "message_update"
                  and e.get("assistantMessageEvent", {}).get("type") == "text_delta"
              ]
              print("RPC EVENTS:")
              print(json.dumps(events, indent=2))
              print("SERVER LOG:")
              print(open(os.path.join(os.path.dirname(session_dir), "server.log")).read())
              assert "".join(deltas) == "Hello from Pi.", deltas
              assert any(e.get("type") == "agent_end" for e in events), events
              assert any(e.get("type") == "agent_settled" for e in events), events

              send(p, {"type": "get_messages"})
              msg_events = read_until(p, lambda x: x.get("type") == "response" and x.get("command") == "get_messages")
              messages = next(x["data"]["messages"] for x in msg_events if x.get("type") == "response")
              assert any(m.get("role") == "assistant" for m in messages), messages
          finally:
              p.terminate()
              p.wait(timeout=5)

          # 2) Resume the exact persisted session in a fresh process.
          p = subprocess.Popen(
              ["pi", "--mode", "rpc", "--session", session_file],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
              env=os.environ.copy(),
          )
          try:
              send(p, {"type": "get_state"})
              resumed_events = read_until(p, lambda x: x.get("type") == "response" and x.get("command") == "get_state")
              resumed = next(x["data"] for x in resumed_events if x.get("type") == "response")
              assert resumed["sessionId"] == state["sessionId"], (resumed, state)
              assert resumed["messageCount"] >= 2, resumed
              send(p, {"type": "get_messages"})
              resumed_msgs_events = read_until(p, lambda x: x.get("type") == "response" and x.get("command") == "get_messages")
              resumed_msgs = next(x["data"]["messages"] for x in resumed_msgs_events if x.get("type") == "response")
              assert len(resumed_msgs) >= len(messages), (len(resumed_msgs), len(messages))
          finally:
              p.terminate()
              p.wait(timeout=5)

          # 3) Abort a real in-flight prompt and require the session to settle.
          p = start([])
          try:
              send(p, {"type": "prompt", "message": "abort this prompt"})
              time.sleep(0.5)
              send(p, {"type": "abort"})
              abort_events = read_until(p, lambda x: x.get("type") == "agent_settled", timeout=10)
              assert any(x.get("type") == "agent_end" for x in abort_events), abort_events
              assert any(x.get("type") == "agent_settled" for x in abort_events), abort_events
          finally:
              p.terminate()
              p.wait(timeout=5)

          print("PI RPC E2E PASS: handshake, model discovery, streaming text, session persistence/resume, and abort.")
          PY

          python3 "$ROOT/rpc_test.py"
