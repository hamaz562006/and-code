name: PR APK Build

# Builds a debug APK automatically on every pull request update and uploads it
# as an artifact + PR comment. No label or manual dispatch required.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      # Same shape as android.yml / release.yml: rely on the runner's Android SDK
      # and Gradle's automatic component installs. Do NOT use android-actions/setup-android
      # which still requests the removed "tools" package and fails on current runners.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test and build debug APK
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug

      - id: upload-apk
        name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: and-code-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Comment or update APK link on PR
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = '${{ steps.upload-apk.outputs.artifact-url }}';
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, state: 'open', per_page: 5,
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.info('No associated pull request found; skipping comment.');
              return;
            }
            const marker = '<!-- and-code-debug-apk -->';
            const body = [
              marker,
              '**Debug APK built successfully**',
              '',
              `[Download APK artifact](${artifactUrl})`,
              `[View workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,
              '',
              `Commit: \`${context.sha.slice(0, 12)}\` | Artifact expires in 14 days.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }
