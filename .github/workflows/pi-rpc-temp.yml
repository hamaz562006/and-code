name: Temporary Pi RPC test

on:
  push:
    branches: [feature/pi-agent-clean]

permissions:
  contents: read

jobs:
  rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pi
        run: npm install -g --ignore-scripts --no-fund --no-audit @earendil-works/pi-coding-agent@0.87.1
      - name: Test RPC protocol
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          p = subprocess.Popen(
              ["pi", "--mode", "rpc", "--no-session"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True,
          )
          def request(obj):
              p.stdin.write(json.dumps(obj) + "\n")
              p.stdin.flush()
              while True:
                  line = p.stdout.readline()
                  if not line:
                      raise RuntimeError("Pi RPC exited before response")
                  obj = json.loads(line)
                  if obj.get("type") == "response" and obj.get("id") == obj.get("_expected_id"):
                      return obj
          def req(i, typ, **extra):
              cmd = {"id": i, "type": typ, **extra}
              p.stdin.write(json.dumps(cmd) + "\n")
              p.stdin.flush()
              while True:
                  line = p.stdout.readline()
                  if not line:
                      raise RuntimeError("Pi RPC exited before response")
                  obj = json.loads(line)
                  if obj.get("type") == "response" and obj.get("id") == i:
                      assert obj.get("success") is True, obj
                      return obj
          state = req("1", "get_state")
          assert state["data"]["sessionId"]
          req("2", "get_messages")
          models = req("3", "get_available_models")
          assert isinstance(models["data"]["models"], list)
          req("4", "set_session_name", name="AndCode Pi RPC Test")
          req("5", "get_state")
          p.terminate()
          p.wait(timeout=10)
          print("Pi RPC smoke test passed")
          PY
